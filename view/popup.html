<!DOCTYPE html>
<html lang="en">

<head>
    <title>Shiori Sync</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/source-sans-pro.min.css">
    <link rel="stylesheet" href="../css/fontawesome.min.css">
    <link rel="stylesheet" href="../css/popup.css">

    <script type="application/javascript" src="../js/browser-polyfill.js"></script>
</head>

<body>
    <div id="popup-box">
        <div id="status-check">
            <div id="logo">
                <img src="../icons/icon.svg">
            </div>
            <p id="sync-status">Checking...</p>
            <p id="error-message" style="display: none"></p>
            <a id="btn-sync" class="button">Sync Now</a>
            <a id="btn-open-options" class="button">Settings</a>
            <a id="btn-libraries" class="button">Open Shiori</a>
        </div>
    </div>

    <script type="application/javascript" src="../js/popup.js"></script>
</body>

</html>
